name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            mcp
      - run: bash scripts/check-versions.sh
      - run: bash scripts/lint-rust.sh
      - run: bash scripts/test-rust.sh
      - run: cargo build --locked --manifest-path mcp/Cargo.toml
      - run: bash scripts/smoke-mcp.sh

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake jq ninja-build
      - run: bash integrations/omarchy/dicta-context/tests/native-cli-contract.sh
      - run: bash integrations/omarchy/tests/shortcut-install-test.sh
      - run: cmake -S apps/dicta-native -B apps/dicta-native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDICTA_BUILD_TESTS=ON
      - run: cmake --build apps/dicta-native/build --parallel
      - run: ctest --test-dir apps/dicta-native/build --output-on-failure
      - run: cmake --build apps/dicta-native/build --target dicta-native_qmllint
      - run: bash scripts/package-native-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dicta-native-linux-${{ runner.arch }}
          path: target/bundle/native-linux/Dicta_*_native_linux_*.tar.gz
          if-no-files-found: error
