[package]
name = "dicta-mcp"
version = "0.3.0"
description = "Read-only MCP server for Dicta project guidance"
edition = "2021"

[build-dependencies]
cc = "1"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
