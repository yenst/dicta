[package]
name = "dicta-mcp"
version = "0.8.0"
description = "Read-only MCP server for Dicta project guidance"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dicta-core = { path = "../crates/dicta-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
