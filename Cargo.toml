[workspace]
members = [
    "apps/dicta-cli",
    "apps/dicta-native/rust",
    "crates/dicta-capture",
    "crates/dicta-control",
    "crates/dicta-core",
    "crates/dicta-engine",
    "crates/dicta-linux",
    "crates/dicta-overlay",
    "crates/dicta-runtime",
    "crates/dicta-transcribe",
]
exclude = ["mcp"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
